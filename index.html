
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#260817">
  <title>Для Карины ❤️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      color: white;
      background:
        radial-gradient(ellipse at 50% 40%, #6e1740 0%, transparent 48%),
        linear-gradient(145deg, #160610, #390d27 55%, #170612);
      font-family: 'Montserrat', sans-serif;
    }

    .scene {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 28px 22px;
      overflow: hidden;
      isolation: isolate;
    }

    .glow {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: #ff3f89;
      filter: blur(110px);
      opacity: 0.19;
      animation: glow 5s ease-in-out infinite alternate;
      z-index: -1;
    }

    .glow.one {
      top: -120px;
      left: -100px;
    }

    .glow.two {
      bottom: -150px;
      right: -80px;
      background: #ff174f;
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 700px;
      text-align: center;
      animation: appear 1.8s ease both;
    }

    .top-heart {
      color: #ffb5ce;
      font-size: 34px;
      margin-bottom: 22px;
      display: inline-block;
      animation: heartbeat 1.7s ease-in-out infinite;
      text-shadow: 0 0 25px #ff438c;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #ffc0d6;
      margin-bottom: 24px;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-weight: 400;
      font-size: clamp(48px, 10vw, 86px);
      line-height: 1.2;
      color: #fff0f5;
      text-shadow:
        0 0 12px rgba(255, 144, 188, 0.45),
        0 0 45px rgba(255, 46, 119, 0.22);
    }

    h1 span {
      display: block;
      color: #ffb0cd;
      margin-top: 8px;
    }

    .line {
      width: 95px;
      height: 1px;
      margin: 30px auto;
      background: linear-gradient(90deg, transparent, #ffb0cd, transparent);
    }

    .message {
      max-width: 440px;
      margin: 0 auto;
      font-size: 14px;
      line-height: 2;
      font-weight: 300;
      color: #f7dce7;
      letter-spacing: 0.4px;
    }

    .love-button {
      margin-top: 35px;
      padding: 14px 28px;
      border: 1px solid rgba(255, 190, 215, 0.6);
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.06);
      color: #fff0f5;
      font: inherit;
      font-size: 13px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.3s ease;
      box-shadow: 0 0 25px rgba(255, 65, 135, 0.08);
      -webkit-tap-highlight-color: transparent;
    }

    .love-button:hover {
      background: rgba(255, 100, 160, 0.18);
      box-shadow: 0 0 35px rgba(255, 65, 135, 0.25);
      transform: translateY(-2px);
    }

    .secret {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.8s ease, opacity 0.8s ease,
                  margin 0.8s ease;
      color: #ffd2e2;
      font-family: 'Great Vibes', cursive;
      font-size: 34px;
      line-height: 1.4;
    }

    .secret.show {
      max-height: 180px;
      opacity: 1;
      margin-top: 25px;
    }

    .bottom-heart {
      margin-top: 35px;
      color: #ff8db8;
      font-size: 16px;
      letter-spacing: 12px;
      opacity: 0.8;
    }

    .floating-heart {
      position: absolute;
      bottom: -50px;
      color: #ff7cab;
      pointer-events: none;
      user-select: none;
      z-index: 1;
      animation: floatUp linear forwards;
      filter: drop-shadow(0 0 8px rgba(255, 80, 140, 0.3));
    }

    .sparkle {
      position: absolute;
      color: #ffe3ed;
      opacity: 0;
      animation: twinkle 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.7);
        opacity: 0;
      }
      10% {
        opacity: 0.7;
      }
      85% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-115vh) rotate(35deg) scale(1.2);
        opacity: 0;
      }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.18); }
      30% { transform: scale(1); }
      45% { transform: scale(1.12); }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glow {
      from { transform: scale(0.9); opacity: 0.13; }
      to { transform: scale(1.15); opacity: 0.25; }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.05; transform: scale(0.7); }
      50% { opacity: 0.8; transform: scale(1.2); }
    }

    @media (max-width: 480px) {
      .eyebrow {
        letter-spacing: 3px;
        font-size: 10px;
      }

      .message {
        font-size: 13px;
      }

      .line {
        margin: 24px auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="scene" id="scene">
    <div class="glow one"></div>
    <div class="glow two"></div>

    <span class="sparkle" style="top:15%;left:15%">✦</span>
    <span class="sparkle" style="top:24%;right:13%;animation-delay:1s">✧</span>
    <span class="sparkle" style="bottom:20%;left:20%;animation-delay:1.8s">✧</span>
    <span class="sparkle" style="bottom:16%;right:17%;animation-delay:.5s">✦</span>

    <section class="content">
      <div class="top-heart">♥</div>

      <p class="eyebrow">Одно послание для одного человека</p>

      <h1>
        Карина,
        <span>я тебя очень сильно люблю</span>
      </h1>

      <div class="line"></div>

      <p class="message">
        Иногда самые важные слова сложно сказать вслух.
        Поэтому я хочу, чтобы ты просто знала:
        ты очень много для меня значишь. ❤️
      </p>

      <button class="love-button" id="loveButton" type="button">
        Для тебя ♥
      </button>

      <p class="secret" id="secret" aria-live="polite">
        Ты — моё самое тёплое чувство. ❤️
      </p>

      <div class="bottom-heart">♥ ♥ ♥</div>
    </section>
  </main>

  <script>
    const scene = document.getElementById('scene');
    const button = document.getElementById('loveButton');
    const secret = document.getElementById('secret');

    const hearts = ['♥', '♡', '❤', '💕'];

    function createHeart() {
      const heart = document.createElement('span');
      heart.className = 'floating-heart';
      heart.textContent = hearts[
        Math.floor(Math.random() * hearts.length)
      ];

      heart.style.left = Math.random() * 100 + '%';
      heart.style.fontSize = (14 + Math.random() * 22) + 'px';
      heart.style.animationDuration = (7 + Math.random() * 7) + 's';

      scene.appendChild(heart);

      setTimeout(() => heart.remove(), 15000);
    }

    for (let i = 0; i < 12; i++) {
      setTimeout(createHeart, i * 350);
    }

    setInterval(createHeart, 650);

    button.addEventListener('click', () => {
      secret.classList.toggle('show');

      button.textContent = secret.classList.contains('show')
        ? 'Ещё одно сердечко ♥'
        : 'Для тебя ♥';

      for (let i = 0; i < 12; i++) {
        setTimeout(createHeart, i * 90);
      }
    });
  </script>
</body>
</html>
